<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131f">
  <title>{{ page.title }} · Recc</title>
  <style>
    :root { color-scheme: dark; --ink:#f7f5ff; --muted:#b7b5c9; --lime:#c9fa62; --panel:#1a1d2c; }
    * { box-sizing:border-box; }
    body { margin:0; background:radial-gradient(ellipse at 80% 5%,#332b5b 0,transparent 36rem),#10131f; color:var(--ink); font:16px/1.7 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(820px, calc(100% - 40px)); margin:auto; }
    header { padding:26px 0; border-bottom:1px solid #303248; }
    header a { color:var(--ink); font-size:1.35rem; font-weight:800; letter-spacing:-.06em; text-decoration:none; }
    header span { color:var(--lime); }
    article { padding:45px 0 70px; }
    h1,h2,h3 { line-height:1.2; letter-spacing:-.035em; }
    h1 { font-size:clamp(2rem,6vw,3rem); }
    h2 { margin-top:2em; font-size:1.35rem; }
    p,li { color:#d3d1df; }
    a { color:var(--lime); text-underline-offset:3px; overflow-wrap:anywhere; }
    footer { border-top:1px solid #303248; padding:20px 0 34px; color:var(--muted); font-size:.9rem; }
  </style>
</head>
<body>
  <main>
    <header><a href="./">recc<span>.</span></a></header>
    <article>{{ content }}</article>
    <footer><a href="./">Back to Recc</a> · <a href="./privacy.html">Privacy</a> · <a href="./terms.html">Terms</a></footer>
  </main>
</body>
</html>
